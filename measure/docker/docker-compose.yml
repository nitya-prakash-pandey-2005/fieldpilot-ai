name: measurecv

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: measurecv:gpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MEASURECV_CONFIG: /app/configs/default.yaml
      MEASURECV__LOG_JSON: "true"
      MEASURECV__LOG_LEVEL: INFO
      # Set a real key before exposing this beyond localhost. The service logs
      # a warning at startup when authentication is off.
      MEASURECV__API__API_KEYS: '["${MEASURECV_API_KEY:-}"]'
      MEASURECV__API__MAX_CONCURRENT_INFERENCES: "2"
    volumes:
      # Weights are ~4 GB and must survive image rebuilds; keeping them in a
      # named volume avoids re-downloading on every deploy.
      - model-cache:/models
      - ../outputs:/app/outputs
      # Mount a calibration profile to get out of the ~15% uncalibrated regime.
      - ../calibration:/app/calibration:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # PyTorch's dataloader and CUDA allocator use shared memory; the 64 MB
    # Docker default causes obscure "bus error" crashes under load.
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  model-cache:
  prometheus-data:
  grafana-data:
