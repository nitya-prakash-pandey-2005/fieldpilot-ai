name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy types-PyYAML
      - name: ruff check
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests
      - name: mypy
        run: mypy src/measurecv

  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
        # The full matrix on every OS is wasteful; run the newest Python
        # everywhere and the oldest only on Linux.
        exclude:
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The test-suite runs entirely against the synthetic backends, so CI
      # never downloads model weights. That is what keeps it fast enough to
      # run on every push -- and the accuracy tests still assert against
      # analytic ground truth, so they catch real geometry regressions.
      - name: Install
        run: pip install -e ".[api,dev]"

      - name: Run tests
        run: pytest --cov=measurecv --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  accuracy:
    name: Accuracy regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      # These are the tests that assert measured values against closed-form
      # truth. Running them as their own job makes an accuracy regression
      # visible as a distinct red check rather than one failure among many.
      - name: Geometry and measurement accuracy
        run: |
          pytest tests/test_geometry.py tests/test_measurement.py \
                 tests/test_calibration.py tests/test_models.py \
                 -q --no-header

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: cpu
          push: false
          load: true
          tags: measurecv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm measurecv:ci version
          # Exercise the whole pipeline without weights or a GPU.
          docker run --rm measurecv:ci benchmark --dry-run -n 2 --warmup 1

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit
        run: pip-audit --desc --ignore-vuln GHSA-none || true
        continue-on-error: true
